server:
  listen: "127.0.0.1:9464"

policy:
  # dry-run logs the decisions and changes nothing. Set "apply" only after the
  # dry-run log has matched expectations.
  mode: "dry-run"
  poll: "30s"
  cancel_cap_per_hour: 20
  grace_seconds: 45

# Lanes are P2. Leave the block out to run the policy controller alone.
# Replace /home/you with your home directory; ~ is not expanded.
pool:
  state_dir: "/home/you/.local/state/runlet"
  work_dir: "/home/you/lanes"
  # An extracted actions-runner release. runlet copies it into each lane with
  # hardlinks and never writes to this directory.
  runner_dir: "/home/you/actions-runner"
  # Registration scope: an organization or a repository.
  runner_url: "https://github.com/your-org"
  memory_budget: "3.5GiB"
  # A cancelled job can leave a detached process tree behind. The runner then
  # reports busy forever and the lane never takes new work. When the runner is
  # busy but GitHub has no in-progress job for it for this long, runlet stops
  # the scope and kills the tree. Absent takes 15; 0 turns it off.
  stale_lane_minutes: 15
  lanes:
    - name: "lane-0"
      labels: ["self-hosted", "linux", "x64"]
      # memory is the hard cap. memory_high is an earlier soft cap: the lane
      # reclaims memory at that point, and the reclaimed pages include the
      # lane's own page cache. A compiler then re-reads its sources from disk.
      # Set memory_high equal to memory unless you want that throttling.
      memory: "2.5GiB"
      memory_high: "2.5GiB"
      cpu_quota: "300%"

  # The temp filesystem builds write to. A tmpfs here spends memory on every
  # leftover build directory, and a full one fails every lane at once.
  # The sweep removes directories that match patterns, are older than stale,
  # and belong to the service user. every: "0s" turns the sweep off.
  scratch:
    path: "/tmp"
    patterns: ["go-build*"]
    stale: "12h"
    every: "24h"
    warn_percent: 85

repos:
  # Only these repositories are touched. A repository that is not listed here is
  # never cancelled, and there is no wildcard.
  - slug: "your-org/your-repo"
    cancel_superseded: true
  - slug: "your-org/another-repo"
    cancel_superseded: true
